[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlscout"
version = "0.1.0"
description = "Data-analyst agent that answers questions by writing and running guarded SQL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hitesh Kavati" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlglot>=25",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
sqlscout = "sqlscout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlscout"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/sqlscout/datagen.py" = ["E501"]
